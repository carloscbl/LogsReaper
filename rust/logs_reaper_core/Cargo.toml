[package]
name = "logs_reaper_core"
version = "0.2.0"
edition = "2021"
license = "MIT"

[lib]
name = "logs_reaper_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "logs_reaper_hotpath"
path = "src/main.rs"

[features]
default = []
python = ["pyo3/extension-module", "arrow/pyarrow"]

[dependencies]
blake3 = "1"
rustc-hash = "2"
memchr = "2"
memmap2 = "0.9"
rayon = "1"
crossbeam-channel = "0.5"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonic-rs = "0.3"
twox-hash = "1.6"
arrow = { version = "57", default-features = false, features = ["ipc"] }
parquet = { version = "57", default-features = false, features = ["arrow", "zstd"] }
pyo3 = { version = "0.26", optional = true }
once_cell = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
